name: Product quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar_test
          POSTGRES_PASSWORD: radar_test
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TESTING: 'true'
      PYTHONPATH: backend
      RADAR_TEST_DATABASE_URL: postgresql://radar_test:radar_test@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install pip==26.2.1 && pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/alembic
      - run: pytest backend/tests -q
      - run: python scripts/check_task_queues.py
        env:
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      - run: cd backend && alembic heads
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: python ../scripts/check_release.py --check-template
      - run: node --test ../scripts/consent-policy.test.mjs
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.49.1 pydantic-settings==2.16.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression (explicit API fixtures)
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/radar-ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          python ../scripts/brand_ui_smoke.py
          python ../scripts/ui_smoke.py
          python ../scripts/consent_ui_smoke.py
          python ../scripts/legal_ui_smoke.py
        env:
          TESTING: 'true'
          RADAR_UI_BASE_URL: http://127.0.0.1:3000
  migration-history:
    name: Historical migration chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar_test
          POSTGRES_PASSWORD: radar_test
          POSTGRES_DB: radar_history
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESTING: 'true'
      DATABASE_URL: postgresql://radar_test:radar_test@localhost:5432/radar_history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip==26.2.1 && pip install -r backend/requirements.txt
      - run: python scripts/check_migration_history.py
        env:
          PYTHONPATH: backend
          RADAR_TEST_DATABASE_URL: postgresql://radar_test:radar_test@localhost:5432/radar_history
