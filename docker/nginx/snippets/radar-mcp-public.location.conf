# Replace only the existing exact /mcp block in the radarapp.fr server.
# Load radar-mcp-html.map.conf in http first.
# Frontend upstream confirmed from radar-frontend-1 port mapping on 2026-11-16.
location = /mcp {
    error_page 418 = @radar_mcp_public_page;
    if ($radar_mcp_public_html) { return 418; }

    proxy_pass http://127.0.0.1:13100;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_cache off;
}

location @radar_mcp_public_page {
    proxy_pass http://127.0.0.1:13000;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache off;
}
