services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    volumes:
      - ..:/workspaces/radar:cached
    command: sleep infinity
    environment:
      RADAR_CODESPACES_SANDBOX: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar_codespaces_test
      POSTGRES_USER: radar_test
      # Disposable, internal-only sandbox. No published database port.
      POSTGRES_PASSWORD: codespaces-test-only
    volumes:
      - radar_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_test -d radar_codespaces_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  radar_test_postgres:
